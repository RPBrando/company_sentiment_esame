apiVersion: 1

groups:
  - orgId: 1
    name: company-sentiment-availability
    folder: Company Sentiment
    interval: 30s

    rules:
      - uid: company-sentiment-api-scrape-down
        title: FastAPI scraping unavailable
        condition: B

        data:
          - refId: A
            datasourceUid: company-sentiment-prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: prometheus
                uid: company-sentiment-prometheus
              editorMode: code
              expr: 'up{job="company-sentiment-api"}'
              instant: true
              range: false
              intervalMs: 15000
              maxDataPoints: 43200
              refId: A

          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: A
              refId: B
              conditions:
                - type: query
                  query:
                    params:
                      - B
                  reducer:
                    type: last
                    params: []
                  evaluator:
                    type: lt
                    params:
                      - 1
                  operator:
                    type: and

        noDataState: NoData
        execErrState: Error
        for: 1m
        isPaused: false

        annotations:
          summary: Scraping FastAPI non disponibile
          description: Il valore up del job company-sentiment-api è inferiore a 1 da almeno un minuto.

        labels:
          service: company-sentiment-api
          severity: warning