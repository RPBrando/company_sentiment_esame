name: company-sentiment-monitoring

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: company-sentiment:monitoring-local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PERSISTENT_DATA_PATH: /app/data
      HF_MODEL_PATH: /app/model
      HF_DATASET_PATH: /app/data/sentiment_datasets
      HF_HOME: /app/model/.hf-cache
    volumes:
      - api_data:/app/data
      - api_models:/app/model
      - ./data/sentiment_datasets:/app/data/sentiment_datasets:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8000/health', timeout=5).read()
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 30s

  grafana:
    image: grafana/grafana:13.2.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_PLUGINS_PREINSTALL_SYNC: yesoreyeram-infinity-datasource@4.1.1
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Imposta GRAFANA_ADMIN_PASSWORD nel terminale}"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      api:
        condition: service_healthy


  prometheus:
    image: prom/prometheus:v3.13.4
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy


volumes:
  api_data: {}
  api_models: {}
  grafana_data: {}
  prometheus_data: {}